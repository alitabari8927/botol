<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لیست فالووینگ‌ها</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #9aa2b1;
    --accent: #6c8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Vazirmatn", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }

  form {
    display: flex;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type=text] {
    flex: 1;
    min-width: 160px;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 15px;
  }
  input[type=number] {
    width: 90px;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 8px;
    border-radius: 8px;
    font-size: 15px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }

  #status { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 20px; }
  #status.error { color: var(--danger); }

  #results { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #2a2f3a; object-fit: cover; flex-shrink: 0;
  }
  .names { display: flex; flex-direction: column; overflow: hidden; }
  .username { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fullname { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 999px; margin-inline-start: 4px; }
  .badge.private { background: #3a2f1a; color: #e8b64b; }
  .badge.verified { background: #16324a; color: #6cb4ff; }
  a.link { color: inherit; text-decoration: none; margin-inline-start: auto; color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>لیست فالووینگ‌ها</h1>
    <p class="sub">یوزرنیم اینستاگرام رو بزن — حساب‌هایی که آن یوزر فالو کرده نمایش داده می‌شود.</p>

    <form id="form">
      <input type="text" id="username" placeholder="مثلاً nasa یا @nasa" autocomplete="off" required>
      <input type="number" id="limit" value="{{ default_limit }}" min="1" max="{{ max_limit }}" title="حداکثر تعداد">
      <button type="submit" id="submitBtn">دریافت لیست</button>
    </form>

    <div id="status"></div>
    <div id="results"></div>
  </div>

<script>
const form = document.getElementById('form');
const usernameInput = document.getElementById('username');
const limitInput = document.getElementById('limit');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

function setStatus(text, isError) {
  statusEl.textContent = text || '';
  statusEl.classList.toggle('error', !!isError);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderResults(data) {
  resultsEl.innerHTML = '';
  if (!data.following.length) {
    setStatus('نتیجه‌ای پیدا نشد.');
    return;
  }
  setStatus(`${data.count} حساب پیدا شد که @${escapeHtml(data.username)} فالو کرده` +
             (data.target_is_private ? ' (توجه: خود این اکانت private است، ممکن است لیست ناقص باشد)' : ''));

  const frag = document.createDocumentFragment();
  data.following.forEach(u => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <img class="avatar" src="${escapeHtml(u.profile_pic_url)}" onerror="this.style.visibility='hidden'">
      <div class="names">
        <div class="username">
          @${escapeHtml(u.username)}
          ${u.is_verified ? '<span class="badge verified">تایید شده</span>' : ''}
          ${u.is_private ? '<span class="badge private">خصوصی</span>' : ''}
        </div>
        <div class="fullname">${escapeHtml(u.full_name)}</div>
      </div>
      <a class="link" href="https://instagram.com/${encodeURIComponent(u.username)}" target="_blank" rel="noopener">پروفایل</a>
    `;
    frag.appendChild(row);
  });
  resultsEl.appendChild(frag);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = usernameInput.value.trim().replace(/^@/, '');
  const limit = limitInput.value || {{ default_limit }};
  if (!username) return;

  submitBtn.disabled = true;
  resultsEl.innerHTML = '';
  setStatus('در حال دریافت اطلاعات...');

  try {
    const res = await fetch(`/api/following?username=${encodeURIComponent(username)}&limit=${encodeURIComponent(limit)}`);
    const data = await res.json();
    if (!res.ok) {
      setStatus(data.error || 'خطای ناشناخته', true);
      return;
    }
    renderResults(data);
  } catch (err) {
    setStatus('خطا در ارتباط با سرور: ' + err.message, true);
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
